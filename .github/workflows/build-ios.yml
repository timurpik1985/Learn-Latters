name: Build and Sign iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications/ | grep -i Xcode || true

          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
            echo "Selected Xcode 26.0.1"
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
            echo "Selected Xcode 26.0"
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
            echo "Selected Xcode 26"
          else
            echo "ERROR: Xcode 26 not found on runner"
            ls /Applications/ | grep -i Xcode || true
            exit 1
          fi

          xcodebuild -version

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: "1234"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n ' | base64 --decode --output "$CERTIFICATE_PATH"

          security create-keychain -p "buildpassword" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "buildpassword" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildpassword" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n ' | base64 --decode --output "$PP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "Installed provisioning profile UUID: $UUID"

      - name: System Environment Setup
        run: |
          npm install -g cordova@12.0.0 --force
          cordova --version
          node --version
          npm --version

      - name: Prepare Platform
        run: |
          rm -rf platforms plugins
          cordova platform add ios@7.1.1 --non-interactive

      - name: Fix Pods framework reference for Hebrew app name
        run: |
          echo "Fixing broken Pods______________ framework reference caused by Hebrew app name..."
          PBXPROJ=$(find platforms/ios -name "project.pbxproj" -not -path "*/Pods/*" | head -n 1)
          echo "pbxproj: $PBXPROJ"

          # Find the actual Pods framework name used in the Pods project
          PODS_XCODEPROJ=$(find platforms/ios/Pods -name "*.xcodeproj" | head -n 1)
          echo "Pods xcodeproj: $PODS_XCODEPROJ"

          # Replace the broken Pods______________ with the correct Pods-<appname> reference
          # The issue is Hebrew chars get mangled in the framework name
          # Fix: replace any 'Pods__*' framework reference with correct name
          PODS_FRAMEWORK=$(grep -o 'Pods-[^ "]*' "$PBXPROJ" | head -n 1 || true)
          echo "Found Pods framework name: $PODS_FRAMEWORK"

          if [ -z "$PODS_FRAMEWORK" ]; then
            echo "Trying to find framework in Pods build settings..."
            PODS_FRAMEWORK=$(find platforms/ios/Pods -name "*.framework" | grep -v ".dSYM" | head -n 1 | xargs basename | sed 's/.framework//' || true)
          fi

          # Direct fix: patch the OTHER_LDFLAGS to remove the broken Pods__ reference
          perl -0pi -e 's/-framework ["\x27]?Pods_{2,}["\x27]?//g' "$PBXPROJ"
          echo "Removed broken Pods______________ framework reference"

          # Also fix in Pods xcconfig files if present
          find platforms/ios -name "*.xcconfig" -not -path "*/DerivedData/*" | while read f; do
            perl -0pi -e 's/-framework ["\x27]?Pods_{2,}["\x27]?//g' "$f"
          done

          echo "Pods fix complete."

      - name: Patch AdMob Plus Swift Compatibility for Xcode 26
        run: |
          echo "Patching admob-plus-cordova Swift files for Xcode 26 + cordova-ios 7.1.1..."

          ADMOB_DIR=$(find platforms/ios -path "*/Plugins/admob-plus-cordova" -type d | head -n 1)

          if [ -z "$ADMOB_DIR" ]; then
            echo "ERROR: admob-plus-cordova plugin directory not found."
            find platforms/ios -path "*admob*" -type f || true
            exit 1
          fi

          echo "AdMob plugin dir: $ADMOB_DIR"

          find "$ADMOB_DIR" -name "*.swift" -print0 | xargs -0 perl -0pi -e 's/callbackId: command\.callbackId\)/callbackId: command.callbackId!\)/g'
          find "$ADMOB_DIR" -name "*.swift" -print0 | xargs -0 perl -0pi -e 's/result\.setKeepCallbackAs\(true\)/result?.setKeepCallbackAs(true)/g'
          find "$ADMOB_DIR" -name "*.swift" -print0 | xargs -0 perl -0pi -e 's/result\?\.setKeepCallbackAs\(true\)/result?.setKeepCallbackAs(true)/g'
          find "$ADMOB_DIR" -name "*.swift" -print0 | xargs -0 perl -0pi -e 's/fromRootViewController: plugin\.viewController/fromRootViewController: plugin.viewController!/g'
          find "$ADMOB_DIR" -name "*.swift" -print0 | xargs -0 perl -0pi -e 's/rootViewController: plugin\.viewController/rootViewController: plugin.viewController!/g'

          echo "Patch complete."

      - name: Stabilize Swift Release Build
        run: |
          PBXPROJ=$(find platforms/ios -name "project.pbxproj" -not -path "*/Pods/*" | head -n 1)

          if [ -z "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found"
            exit 1
          fi

          perl -0pi -e 's/SWIFT_OPTIMIZATION_LEVEL = "-O";/SWIFT_OPTIMIZATION_LEVEL = "-Onone";/g' "$PBXPROJ"
          perl -0pi -e 's/SWIFT_OPTIMIZATION_LEVEL = "-Owholemodule";/SWIFT_OPTIMIZATION_LEVEL = "-Onone";/g' "$PBXPROJ"
          perl -0pi -e 's/SWIFT_COMPILATION_MODE = wholemodule;/SWIFT_COMPILATION_MODE = singlefile;/g' "$PBXPROJ"
          perl -0pi -e 's/ONLY_ACTIVE_ARCH = NO;/ONLY_ACTIVE_ARCH = YES;/g' "$PBXPROJ"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBXPROJ"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBXPROJ"

      - name: Verify ATT and AdMob Plist Keys
        run: |
          PLIST_PATH=$(find platforms/ios -name "*-Info.plist" -not -path "*/Pods/*" | head -n 1)
          echo "Checking plist: $PLIST_PATH"
          echo "NSUserTrackingUsageDescription:"
          /usr/libexec/PlistBuddy -c "Print :NSUserTrackingUsageDescription" "$PLIST_PATH"
          echo "GADApplicationIdentifier:"
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST_PATH"

      - name: Verify iOS icon resources
        run: |
          find platforms/ios -not -path "*/Pods/*" -name "*.png" | grep -E "120|152|167|180|1024|AppIcon|icon" || true

      - name: Force iPad Compliance
        run: |
          PLIST_PATH=$(find platforms/ios -name "*-Info.plist" -not -path "*/Pods/*" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST_PATH"
            echo "Patched $PLIST_PATH"
          fi

      - name: Build Signed App
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/cordova-build.log"

          cordova build ios --release --device --buildConfig=build.json --non-interactive \
            --buildFlag="SWIFT_OPTIMIZATION_LEVEL=-Onone" \
            --buildFlag="SWIFT_COMPILATION_MODE=singlefile" \
            --buildFlag="COMPILER_INDEX_STORE_ENABLE=NO" \
            2>&1 | tee "$RUNNER_TEMP/cordova-build.log"

      - name: Print Build Errors If Failed
        if: failure()
        run: |
          grep -n -i -C 12 "error:" "$RUNNER_TEMP/cordova-build.log" || true

      - name: Locate and Verify IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find platforms/ios -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: "${{ steps.find_ipa.outputs.ipa_path }}"
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: LearnLatters-App
          path: "${{ steps.find_ipa.outputs.ipa_path }}"
