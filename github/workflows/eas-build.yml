name: EAS Build & Submit to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:   # also lets you trigger manually from GitHub UI

jobs:
  build-and-submit:
    name: Build iOS & Submit to TestFlight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (production) on EAS
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to TestFlight via EAS
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # ASC credentials are read from eas.json submit config
          # but you can also pass them as env vars:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
